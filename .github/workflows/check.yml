# Checks react-native/: lint, types, the JS build, then the example app on Android and iOS against the FFmpegKit
# binaries named in react-native/package.json (built by native.yml).
name: Check
on:
  push:
    branches: [main]
    paths: [react-native/**, .github/workflows/check.yml]
  pull_request:
    branches: [main]
    paths: [react-native/**, .github/workflows/check.yml]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: react-native
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: react-native/.nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: react-native/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run prepare
      - run: bun run test
      # The npm package as it would be published; `npm publish <file>` publishes exactly this.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: react-native/wekor-ffmpeg-kit-react-native-*.tgz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bun run build:android:prepare
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: bun run build:android -PreactNativeArchitectures=arm64-v8a

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: react-native/.nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: react-native/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run prepare
      - run: bun run build:ios:prepare
      - run: bun run build:ios
